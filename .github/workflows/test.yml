name: CI

on:
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars
  TOKEN_HASH_PEPPER: ci-test-token-pepper-min16
  RESEND_API_KEY: re_ci_test_key
  CORS_ORIGINS: http://localhost:3001
  FRONTEND_URL: http://localhost:3001
  NEXT_PUBLIC_API_URL: http://localhost:3000

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install fvm & Flutter
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/fvm/bin:$PATH"
          fvm install
          fvm use --force
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}
      - name: Typecheck all workspaces
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}
      - name: Apply migrations
        working-directory: ./packages/database
        run: bun run db:migrate
      - name: Test all workspaces
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}
      - name: Build all workspaces
        run: bun run build
