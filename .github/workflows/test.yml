name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Detect changes ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      workers: ${{ steps.filter.outputs.workers }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            workers:
              - 'apps/workers/**'
            mobile:
              - 'apps/mobile/**'

  packages:
    name: Packages — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Typecheck packages/database
        run: bun run typecheck --filter=@atlasmed/database
      - name: Typecheck packages/access
        run: bun run typecheck --filter=@atlasmed/access
      # Until now no packages/* test ran anywhere in CI, which is how two
      # failures in packages/database went unnoticed. These need no database:
      # they are schema-shape and pure-function tests.
      - name: Test packages
        run: bun run test --filter='./packages/*'

  api:
    name: API — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        run: bun run api:typecheck
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars
          TOKEN_HASH_PEPPER: ci-test-token-pepper-min16
          RESEND_API_KEY: re_ci_test_key
          CORS_ORIGINS: http://localhost:3001
          FRONTEND_URL: http://localhost:3001
        run: bun run --cwd apps/api test:unit
      - name: Build (only if apps/api changed)
        if: needs.changes.outputs.api == 'true'
        run: bun run api:build


  workers:
    name: Workers — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        run: bun run workers:typecheck
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun --cwd apps/workers/temporal test --test-name-pattern='^((?!Integration Tests).)*$'

  mobile:
    name: Mobile — analyze + test
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 30
    if: needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ./apps/mobile

      # pdfium_dart fetches a prebuilt library from a third-party GitHub
      # release on first use. Cached so a PR does not depend on that host being
      # up; keyed by pubspec.lock because the package version pins the release.
      - name: Restaurar cache de assets nativos
        uses: actions/cache@v5
        with:
          path: apps/mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-native-assets-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-assets-

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ./apps/mobile

      - name: Analisar código
        run: fvm flutter analyze
        working-directory: ./apps/mobile

      # Retries only a failed native-asset download, never a failed test.
      - name: Executar testes
        run: ./scripts/run-with-native-asset-retry.sh fvm flutter test
        working-directory: ./apps/mobile
