name: CI

on:
  pull_request:
    branches: [main]

jobs:
  # ── Detect changes ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            workers:
              - 'apps/workers/**'

  packages:
    name: Packages — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Typecheck packages/database
        run: bun run typecheck --filter=@atlasmed/database
      - name: Typecheck packages/access
        run: bun run typecheck --filter=@atlasmed/access
      # Until now no packages/* test ran anywhere in CI, which is how two
      # failures in packages/database went unnoticed. These need no database:
      # they are schema-shape and pure-function tests.
      - name: Test packages
        run: bun run test --filter='./packages/*'

  api:
    name: API — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        run: bun run api:typecheck
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars
          TOKEN_HASH_PEPPER: ci-test-token-pepper-min16
          RESEND_API_KEY: re_ci_test_key
          CORS_ORIGINS: http://localhost:3001
          FRONTEND_URL: http://localhost:3001
        run: bun --cwd apps/api run test:unit
      - name: Build (only if apps/api changed)
        if: needs.changes.outputs.api == 'true'
        run: bun run api:build


  workers:
    name: Workers — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install
      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        run: bun run workers:typecheck
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun --cwd apps/workers/temporal test --test-name-pattern='^((?!Integration Tests).)*$'
