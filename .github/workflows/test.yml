name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Detect changes ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            workers:
              - 'apps/workers/**'

  packages:
    name: Packages — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck packages/database
        working-directory: ./packages/database
        run: bunx tsc -p tsconfig.json --noEmit
      - name: Typecheck packages/access
        working-directory: ./packages/access
        run: bun run typecheck

  api:
    name: API — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        working-directory: ./apps/api
        run: bun run typecheck
      - name: Test
        working-directory: ./apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars
          TOKEN_HASH_PEPPER: ci-test-token-pepper-min16
          RESEND_API_KEY: re_ci_test_key
          CORS_ORIGINS: http://localhost:3001
          FRONTEND_URL: http://localhost:3001
        run: bun run test:unit
      - name: Build (only if apps/api changed)
        if: needs.changes.outputs.api == 'true'
        working-directory: ./apps/api
        run: bun run build

  web:
    name: Web — build
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build (only if apps/web changed)
        if: needs.changes.outputs.web == 'true'
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: bun run build

  workers:
    name: Workers — typecheck + test
    runs-on: ubuntu-latest
    needs: [changes]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        working-directory: ./apps/workers/cnes-ingestion
        run: bun run typecheck
      - name: Test
        working-directory: ./apps/workers/cnes-ingestion
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun test --test-name-pattern='^((?!Integration Tests).)*$'
      - name: Build (only if apps/workers changed)
        if: needs.changes.outputs.workers == 'true'
        working-directory: ./apps/workers/cnes-ingestion
        run: bun run build
