name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  packages:
    name: Packages — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck packages/database
        working-directory: ./packages/database
        run: bunx tsc -p tsconfig.json --noEmit
      - name: Typecheck packages/access
        working-directory: ./packages/access
        run: bun run typecheck

  api:
    name: API — typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasmed_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Apply migrations
        working-directory: ./packages/database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
        run: bun run db:migrate
      - name: Typecheck
        working-directory: ./apps/api
        run: bun run typecheck
      - name: Lint
        working-directory: ./apps/api
        run: bun run lint
      - name: Test
        working-directory: ./apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlasmed_test
          REDIS_URL: redis://localhost:6379
          # Storage / Search — use defaults (no real services needed in CI unit tests)
          STORAGE_ACCESS_KEY_ID: minioadmin
          STORAGE_SECRET_ACCESS_KEY: minioadmin
          STORAGE_BUCKET: atlasmed-test
          STORAGE_REGION: us-east-1
          MEILISEARCH_URL: http://localhost:7700
          MEILISEARCH_API_KEY: masterKey
        run: bun test

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
        run: bun run build

  workers:
    name: Workers — typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        working-directory: ./apps/workers/cnes-ingestion
        run: bun run typecheck
      - name: Test
        working-directory: ./apps/workers/cnes-ingestion
        env:
          NODE_ENV: test
        run: bun test
