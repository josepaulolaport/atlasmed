name: Upload iOS TestFlight

# Two modes:
# 1) build — archive on macos with ASC API key signing, upload, assign group
# 2) from_release — upload an existing IPA attached to a GitHub release tag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: build | from_release
        required: true
        default: build
        type: choice
        options:
          - build
          - from_release
      ref:
        description: Git ref to build (mode=build)
        required: false
        default: main
      release_tag:
        description: GitHub release tag that contains the .ipa (mode=from_release)
        required: false
        default: ""
      beta_group:
        description: TestFlight beta group name (substring match)
        required: false
        default: Main

permissions:
  contents: read

concurrency:
  group: atlasmed-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: inputs.mode == 'build'
    runs-on: macos-15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read Flutter version from FVM
        id: fvm
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/mobile/.fvmrc"))["flutter"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install Flutter deps
        working-directory: apps/mobile
        run: flutter pub get

      - name: Import Apple Distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed -e s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "API_PRIVATE_KEYS_DIR=$HOME/private_keys" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Bump build number from run id
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i '' -E "s/^version: ([^+]+)\\+.*/version: \\1+${BUILD_NUMBER}/" pubspec.yaml
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          grep '^version:' pubspec.yaml

      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>GNT83DZ768</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Compile Flutter iOS (no codesign)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config.production.json

      - name: Archive + export IPA with ASC API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive build/ios/ipa
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=GNT83DZ768 \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath="$ASC_KEY_PATH" \
            -authenticationKeyID="$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID="$APP_STORE_CONNECT_ISSUER_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$PWD/build/ios/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath="$ASC_KEY_PATH" \
            -authenticationKeyID="$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID="$APP_STORE_CONNECT_ISSUER_ID"
          ls -la build/ios/ipa

      - name: Upload + assign TestFlight group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          BETA_GROUP: ${{ inputs.beta_group || 'Main' }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          BUNDLE_ID: br.com.atlasmed.app
          MARKETING_VERSION: "1.0.0"
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/upload-and-assign-testflight.sh" "$(ls -1 build/ios/ipa/*.ipa | head -n1)"

  upload-from-release:
    if: inputs.mode == 'from_release'
    runs-on: macos-15
    environment: production
    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@v5

      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${TAG}" ]]; then
            echo "release_tag required for from_release mode" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/ipa" --pattern '*.ipa'
          IPA="$(ls -1 "$RUNNER_TEMP/ipa"/*.ipa | head -n1)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          # Prefer CFBundleVersion from IPA Info.plist via unzip
          BUILD_NUMBER="$(unzip -p "$IPA" 'Payload/*.app/Info.plist' 2>/dev/null | plutil -extract CFBundleVersion raw -o - - 2>/dev/null || true)"
          if [[ -z "${BUILD_NUMBER}" ]]; then
            BUILD_NUMBER="$(echo "$TAG" | sed -E 's/.*[^0-9]([0-9]+)$/\1/')"
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Using IPA=$IPA build=$BUILD_NUMBER"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "API_PRIVATE_KEYS_DIR=$HOME/private_keys" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload + assign TestFlight group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          BETA_GROUP: ${{ inputs.beta_group || 'Main' }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          BUNDLE_ID: br.com.atlasmed.app
          MARKETING_VERSION: "1.0.0"
        run: bash "$GITHUB_WORKSPACE/.github/scripts/upload-and-assign-testflight.sh" "$IPA"
