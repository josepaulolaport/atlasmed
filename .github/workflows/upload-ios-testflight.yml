name: Upload iOS TestFlight

# Builds a release IPA, uploads to App Store Connect, and assigns the
# "Main" internal TestFlight group (falls back to first internal group
# whose name matches /main/i).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: main
      beta_group:
        description: TestFlight beta group name (substring match, case-insensitive)
        required: false
        default: Main

permissions:
  contents: read

concurrency:
  group: atlasmed-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read Flutter version from FVM
        id: fvm
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("apps/mobile/.fvmrc"))["flutter"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install Flutter deps
        working-directory: apps/mobile
        run: flutter pub get

      - name: Import Apple Distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | sed -e s/\"//g)
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys" \
            "$GITHUB_WORKSPACE/private_keys" "$RUNNER_TEMP/asc_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          cp "$KEY_PATH" "$GITHUB_WORKSPACE/private_keys/"
          cp "$KEY_PATH" "$RUNNER_TEMP/asc_keys/"
          echo "API_PRIVATE_KEYS_DIR=$HOME/private_keys" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Bump build number from run id
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i '' -E "s/^version: ([^+]+)\\+.*/version: \\1+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>GNT83DZ768</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Build App Store IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Let Xcode fetch/create App Store profiles via ASC API key (no Apple ID).
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config.production.json \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            -- \
            DEVELOPMENT_TEAM=GNT83DZ768 \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath="$ASC_KEY_PATH" \
            -authenticationKeyID="$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID="$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to App Store Connect
        id: upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          xcrun altool --upload-package "$IPA" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --bundle-id br.com.atlasmed.app \
            --bundle-short-version-string 1.0.0 \
            --bundle-version "$BUILD_NUMBER"

      - name: Install jq + PyJWT for ASC distribute
        run: |
          brew list jq >/dev/null 2>&1 || brew install jq
          python3 -m pip install --quiet PyJWT cryptography

      - name: Assign build to TestFlight group
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          BETA_GROUP: ${{ inputs.beta_group || 'Main' }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          BUNDLE_ID: br.com.atlasmed.app
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, time, urllib.request
          import jwt  # PyJWT

          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"]
          issuer = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          key_path = os.environ["ASC_KEY_PATH"]
          group_query = os.environ["BETA_GROUP"].strip().lower()
          build_number = os.environ["BUILD_NUMBER"]
          bundle_id = os.environ["BUNDLE_ID"]

          with open(key_path, "r", encoding="utf-8") as f:
              private_key = f.read()

          def token() -> str:
              now = int(time.time())
              return jwt.encode(
                  {
                      "iss": issuer,
                      "iat": now,
                      "exp": now + 1100,
                      "aud": "appstoreconnect-v1",
                  },
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id},
              )

          def api(method: str, path: str, body: dict | None = None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token()}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read().decode()
                  return json.loads(raw) if raw else {}

          apps = api("GET", f"/v1/apps?filter[bundleId]={bundle_id}")
          if not apps.get("data"):
              print("No app for bundle", bundle_id, file=sys.stderr)
              sys.exit(1)
          app_id = apps["data"][0]["id"]
          print("app_id", app_id)

          # Wait until the uploaded build is visible / processed enough to assign.
          build_id = None
          for attempt in range(60):
              builds = api(
                  "GET",
                  f"/v1/builds?filter[app]={app_id}&filter[version]={build_number}&sort=-uploadedDate&limit=5",
              )
              items = builds.get("data") or []
              if items:
                  build_id = items[0]["id"]
                  state = items[0].get("attributes", {}).get("processingState")
                  print(f"build {build_id} processingState={state} (try {attempt+1})")
                  if state in ("VALID", "PROCESSING", "FAILED"):
                      # VALID ready; PROCESSING may still accept group assignment for internal.
                      if state == "FAILED":
                          print("Build processing failed", file=sys.stderr)
                          sys.exit(1)
                      if state == "VALID":
                          break
              else:
                  print(f"build not listed yet (try {attempt+1})")
              time.sleep(30)
          else:
              print("Timed out waiting for build", file=sys.stderr)
              sys.exit(1)

          groups = api("GET", f"/v1/apps/{app_id}/betaGroups?limit=50")
          matched = None
          for g in groups.get("data") or []:
              name = (g.get("attributes") or {}).get("name") or ""
              print("betaGroup:", name, "internal=", (g.get("attributes") or {}).get("isInternalGroup"))
              if group_query in name.lower():
                  matched = g
                  break
          if matched is None:
              # Prefer first internal group if exact name missing
              for g in groups.get("data") or []:
                  if (g.get("attributes") or {}).get("isInternalGroup"):
                      matched = g
                      break
          if matched is None:
              print("No matching beta group", file=sys.stderr)
              sys.exit(1)

          group_id = matched["id"]
          group_name = matched["attributes"]["name"]
          print(f"Assigning build {build_id} → group '{group_name}' ({group_id})")

          # Internal groups: add build relationship.
          api(
              "POST",
              f"/v1/betaGroups/{group_id}/relationships/builds",
              {
                  "data": [{"type": "builds", "id": build_id}],
              },
          )
          print("Assigned OK")
          PY
