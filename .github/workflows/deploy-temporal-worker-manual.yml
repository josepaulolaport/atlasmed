name: Deploy Temporal worker manually

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlasmed-temporal-worker-production-deploy
  cancel-in-progress: false

jobs:
  validate-production-env:
    uses: ./.github/workflows/validate-production-env.yml
    secrets:
      UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
      UNCLOUD_SSH_PRIVATE_KEY: ${{ secrets.UNCLOUD_SSH_PRIVATE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TEMPORAL_DB_PASSWORD: ${{ secrets.TEMPORAL_DB_PASSWORD }}
      MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}

  deploy:
    needs: validate-production-env
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      UC_BUILD_ID: ${{ github.sha }}

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify worker deployment configuration
        working-directory: deploy
        run: bun test uncloud.compose.test.ts

      - name: Install Uncloud CLI
        env:
          UNCLOUD_INSTALL_SHA256: 4df443521dba10eb7b8c497caabe1093aa7414ade8943de48bfec59e159602ef
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/uncloud-install.sh https://get.uncloud.run/install.sh
          echo "$UNCLOUD_INSTALL_SHA256  /tmp/uncloud-install.sh" | sha256sum -c -
          sh /tmp/uncloud-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup SSH key
        env:
          UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
          UNCLOUD_SSH_PRIVATE_KEY: ${{ secrets.UNCLOUD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          scripts/prepare-uncloud-ssh-key.sh ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          UNCLOUD_HOST="$(echo "$UNCLOUD_CONNECT" | sed -E 's#ssh://[^@]+@([^:/]+).*#\1#')"
          ssh-keyscan -H "$UNCLOUD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy Temporal worker
        env:
          UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          TEMPORAL_DB_PASSWORD: ${{ secrets.TEMPORAL_DB_PASSWORD }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          # Must mirror the storage block in deploy-services-to-cluster.yml. This
          # workflow deploys atlasmed-temporal-worker from the same compose file, so
          # any variable missing here interpolates to an empty string — and the worker
          # validates nothing at boot, so it would start and sign requests against the
          # wrong store rather than failing.
          STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
          STORAGE_PUBLIC_ENDPOINT: ${{ vars.STORAGE_PUBLIC_ENDPOINT }}
          STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'atlasmed-production' }}
          STORAGE_REGION: ${{ vars.STORAGE_REGION || 'auto' }}
          STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
        run: uc deploy -f deploy/uncloud.compose.yml atlasmed-temporal-worker --recreate --yes

      - name: Verify worker is running
        env:
          UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
        run: uc inspect atlasmed-temporal-worker
