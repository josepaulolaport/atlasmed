name: 🌐 Flutter Web — Produção

# ⚠️  Este workflow lida APENAS com o build Web (Firebase Hosting).
# Para builds nativos (Android AAB / iOS IPA) com Shorebird, veja
# deploy-mobile-main.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-production.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ./apps/mobile

      - name: Instalar dependências do monorepo
        run: bun install --frozen-lockfile

      - name: Restaurar cache do Turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      # pdfium_dart downloads a prebuilt library from a third-party GitHub
      # release on first use. Without this, every run fetched it again, and on
      # 2026-08-13 one dropped connection failed the job and skipped the
      # production deploy. The artifact is keyed by pubspec.lock because the
      # pdfium release it pulls is pinned by the package version.
      - name: Restaurar cache de assets nativos
        uses: actions/cache@v5
        with:
          path: apps/mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-native-assets-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-assets-

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ./apps/mobile

      - name: Analisar código
        run: bun run mobile:lint

      # Retries only a failed native-asset download, never a failed test.
      - name: Executar testes
        run: ./apps/mobile/scripts/run-with-native-asset-retry.sh bun run mobile:test

  deploy_web_production:
    name: Deploy Web (Produção)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ./apps/mobile

      - name: Restaurar cache de assets nativos
        uses: actions/cache@v5
        with:
          path: apps/mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-native-assets-${{ hashFiles('apps/mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-assets-

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ./apps/mobile

      # The build resolves native assets too, so it carries the same exposure
      # as the test step and gets the same treatment.
      - name: Build Flutter Web (Release)
        run: >-
          ./scripts/run-with-native-asset-retry.sh
          fvm flutter build web --release --dart-define-from-file=config.production.json
        working-directory: ./apps/mobile

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.23.0

      - name: Deploy para Firebase Hosting (Produção)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --project atlasmed-app
        working-directory: ./apps/mobile
