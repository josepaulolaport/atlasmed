name: 🚀 Flutter Web — Produção

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-production.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ./apps/mobile

      - name: Instalar dependências do monorepo
        run: bun install --frozen-lockfile

      - name: Restaurar cache do Turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'apps/**/package.json', 'packages/**/package.json') }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ./apps/mobile

      - name: Analisar código
        run: bun run mobile:lint

      - name: Verificar types
        run: bun run mobile:typecheck

      - name: Executar testes
        run: bun run mobile:test

  deploy_web_production:
    name: Deploy Web (Produção)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ./apps/mobile

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ./apps/mobile

      - name: Build Flutter Web (Release)
        run: fvm flutter build web --release --dart-define-from-file=config.production.json
        working-directory: ./apps/mobile

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.23.0

      - name: Deploy para Firebase Hosting (Produção)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --project atlasmed-app
        working-directory: ./apps/mobile
