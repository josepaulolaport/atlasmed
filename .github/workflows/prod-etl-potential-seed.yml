name: Prod ETL — potential definitions seed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-potential-definitions:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Seed potential metric definitions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd apps/api db:seed:potential-definitions
