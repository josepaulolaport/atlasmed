name: Prod — cleanup multi-UTA patches

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes (false = dry-run only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup-multi-uta-patches:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run multi-UTA patch cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "Mode: APPLY"
            bun run --cwd apps/api db:cleanup:multi-uta-patches:apply
          else
            echo "Mode: DRY-RUN"
            bun run --cwd apps/api db:cleanup:multi-uta-patches
          fi
