# ── Mobile CD — Shorebird + Fastlane ────────────────────────────────
# Executado em todo push ao main com mudanças em apps/mobile/.
#
# Modos:
#   store — Bump minor, Shorebird release iOS e upload ao TestFlight.
#   patch — Bump patch, Shorebird patch OTA iOS via manifest.
#
# Android está temporariamente desativado no CD.
#
# Resolução do modo (resolve_mode):
#   1. Se o PR associado tem label "release/store" → store
#   2. Se arquivos sensíveis iOS mudaram (ios/, pubspec.yaml,
#      shorebird.yaml, config.production.json) → store
#   3. Se shorebird-patches.json tem entradas → patch
#   4. Fallback → store (seguro)
#
# Web deploy (Firebase Hosting) continua no fluxo separado
# deploy-production.yml, executado em paralelo.
# ──────────────────────────────────────────────────────────────────────

name: 📱 Mobile CD — Shorebird

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/deploy-mobile-main.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de entrega mobile
        required: true
        default: store
        type: choice
        options:
          - store
          - patch
      dry_run:
        description: Validar e compilar sem publicar ou alterar versão
        required: true
        default: true
        type: boolean

concurrency:
  group: mobile-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"
  MOBILE_DIR: ./apps/mobile

jobs:
  # ── Preflight ────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Verificar se deve pular
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && echo "${{ github.event.head_commit.message }}" | grep -qE '\[skip ci\]|\[ci skip\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Resolve mode ────────────────────────────────────────────────
  resolve_mode:
    needs: preflight
    if: needs.preflight.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      has_patches: ${{ steps.resolve.outputs.has_patches }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detectar modo de deploy
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          dry_run="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
            dry_run="${{ inputs.dry_run }}"
            echo "▶️ Execução manual: mode=$mode, dry_run=$dry_run"
          else
            mode="patch"
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            # 1. Verificar label do PR associado ao commit que chegou ao main.
            pr_number=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '.[0].number // empty' 2>/dev/null || echo "")

            if [[ -n "$pr_number" ]]; then
              labels=$(gh pr view "$pr_number" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
              if echo "$labels" | grep -qx "release/store"; then
                echo "📋 PR #$pr_number tem a label release/store → store mode"
                mode="store"
              fi
            fi

            # 2. Mudanças nativas ou de configuração exigem uma release completa.
            sensitive_patterns='^apps/mobile/(android/|ios/|pubspec\.yaml|pubspec\.lock|shorebird\.yaml|config\.production\.json)'
            changed_sensitive=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -cE "$sensitive_patterns" || true)
            if [[ "$changed_sensitive" -gt 0 ]]; then
              echo "🔒 Arquivos sensíveis mudaram → store mode"
              mode="store"
            fi
          fi

          # 3. Patch mode só é válido quando o manifest contém patches.
          has_patches="false"
          manifest="${{ env.MOBILE_DIR }}/shorebird-patches.json"
          count=0
          if [[ -f "$manifest" ]]; then
            count=$(jq '.patches | length' "$manifest" 2>/dev/null || echo 0)
          fi
          if [[ "$count" -gt 0 ]]; then
            has_patches="true"
            echo "🩹 Manifest contém $count patch(es)"
          elif [[ "$mode" == "patch" ]]; then
            echo "Manifest sem patches; usando store mode como fallback seguro"
            mode="store"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "has_patches=$has_patches" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "✅ Resolved mode: $mode (patches: $has_patches, dry_run: $dry_run)"

  # ── Setup comum ──────────────────────────────────────────────────
  setup:
    needs: resolve_mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Analisar código
        run: fvm flutter analyze
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Executar testes
        run: fvm flutter test
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Cache do Flutter
        uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}

  # ═════════════════════════════════════════════════════════════════
  # 🏪 Store Mode
  # ═════════════════════════════════════════════════════════════════
  deploy_store:
    needs: [resolve_mode, setup]
    if: needs.resolve_mode.outputs.mode == 'store'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: write # para commitar version bump
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      DRY_RUN: ${{ needs.resolve_mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}

      # Materializar config.production.json
      - name: Materializar config.production.json
        env:
          CONFIG_BASE64: ${{ secrets.CONFIG_PRODUCTION_JSON_BASE64 }}
        run: |
          if [[ -n "$CONFIG_BASE64" ]]; then
            echo "$CONFIG_BASE64" | base64 --decode > config.production.json
          else
            echo "⚠️  CONFIG_PRODUCTION_JSON_BASE64 not set; using existing file"
          fi
        working-directory: ${{ env.MOBILE_DIR }}

      # Ativar Cider
      - name: Ativar Cider
        run: dart pub global activate cider

      # Bump minor version + CHANGELOG (apenas em deploy real)
      - name: Bump minor version
        if: env.DRY_RUN != 'true'
        run: |
          cider bump minor --bump-build
          cider release
        working-directory: ${{ env.MOBILE_DIR }}

      # ── Android signing + Google Play ──
      - name: Instalar credenciais Android
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: ./scripts/setup-android-signing.sh
        working-directory: ${{ env.MOBILE_DIR }}

      # ── iOS signing + App Store Connect ──
      - name: Validar secrets do release iOS
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SHOREBIRD_TOKEN_VALUE: ${{ secrets.SHOREBIRD_TOKEN }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID
            SHOREBIRD_TOKEN_VALUE
            CERTIFICATE_BASE64
            CERTIFICATE_PASSWORD
            PROVISIONING_PROFILE_BASE64
            KEYCHAIN_PASSWORD
            ASC_KEY_ID
            ASC_ISSUER_ID
            ASC_KEY_BASE64
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "Secret obrigatório ausente: $variable" >&2
              exit 1
            fi
          done
          if [[ "$APPLE_TEAM_ID" != "GNT83DZ768" ]]; then
            echo "APPLE_TEAM_ID deve ser GNT83DZ768" >&2
            exit 1
          fi

      - name: Instalar certificado e provisioning profile
        id: ios_signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: ./scripts/setup-ios-signing.sh
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Instalar Shorebird
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      # SHOREBIRD_TOKEN está definido no env do job e é lido automaticamente pelo CLI.
      - name: Shorebird release Android
        run: |
          args=(
            release android
            --no-confirm
            --artifact aab
            --flutter-version=${{ env.FLUTTER_VERSION }}
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          shorebird "${args[@]}" -- \
            --dart-define-from-file=config.production.json \
            --no-tree-shake-icons
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Localizar AAB gerado
        id: android_artifact
        run: |
          set -euo pipefail
          aab_path=$(find "${{ env.MOBILE_DIR }}/build/app/outputs/bundle" -name '*.aab' -print -quit)
          if [[ -z "$aab_path" && "$DRY_RUN" != "true" ]]; then
            echo "AAB não encontrado após shorebird release android" >&2
            exit 1
          fi
          if [[ -n "$aab_path" ]]; then
            echo "path=$GITHUB_WORKSPACE/$aab_path" >> "$GITHUB_OUTPUT"
          else
            echo "Dry-run Android concluído sem artefato persistido"
          fi

      - name: Upload AAB para Google Play (internal)
        if: env.DRY_RUN != 'true'
        env:
          SHOREBIRD_ARTIFACT_PATH: ${{ steps.android_artifact.outputs.path }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH: ${{ steps.android_signing.outputs.play_service_account_path }}
        run: |
          bundle install
          bundle exec fastlane android upload_internal
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Shorebird release iOS
        run: |
          args=(
            release ios
            --no-confirm
            --flutter-version=${{ env.FLUTTER_VERSION }}
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          shorebird "${args[@]}" -- \
            --dart-define-from-file=config.production.json \
            --no-tree-shake-icons
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Localizar IPA gerado
        run: |
          set -euo pipefail
          ipa_path=$(find "${{ env.MOBILE_DIR }}/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          if [[ -z "$ipa_path" && "$DRY_RUN" != "true" ]]; then
            echo "IPA não encontrado após shorebird release ios" >&2
            exit 1
          fi
          if [[ -n "$ipa_path" ]]; then
            echo "SHOREBIRD_ARTIFACT_PATH=$GITHUB_WORKSPACE/$ipa_path" >> "$GITHUB_ENV"
          else
            echo "Dry-run iOS concluído sem artefato persistido"
          fi

      - name: Upload IPA para TestFlight
        if: env.DRY_RUN != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_PATH: ${{ steps.ios_signing.outputs.api_key_path }}
        run: |
          bundle install
          bundle exec fastlane ios upload_testflight
        working-directory: ${{ env.MOBILE_DIR }}

      # Persistir version bump (apenas em deploy real)
      - name: Commitar version bump
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "atlasmed-bot"
          git config user.email "bot@atlasmed.com.br"
          git add ${{ env.MOBILE_DIR }}/pubspec.yaml ${{ env.MOBILE_DIR }}/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "chore: bump mobile version to $(grep '^version:' ${{ env.MOBILE_DIR }}/pubspec.yaml | awk '{print $2}') [skip ci]"
            git push
          fi

      - name: Limpar credenciais temporárias do Android
        if: always()
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android_signing.outputs.keystore_path }}
          ANDROID_KEY_PROPERTIES_PATH: ${{ steps.android_signing.outputs.key_properties_path }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON_PATH: ${{ steps.android_signing.outputs.play_service_account_path }}
        run: ./scripts/cleanup-android-signing.sh
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Limpar credenciais temporárias do iOS
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.ios_signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.ios_signing.outputs.profile_uuid }}
        run: ./scripts/cleanup-ios-signing.sh
        working-directory: ${{ env.MOBILE_DIR }}

  # ═════════════════════════════════════════════════════════════════
  # 🩹 Patch Mode
  # ═════════════════════════════════════════════════════════════════
  deploy_patch:
    needs: [resolve_mode, setup]
    if: needs.resolve_mode.outputs.mode == 'patch'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      DRY_RUN: ${{ needs.resolve_mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Configurar Dart
        uses: dart-lang/setup-dart@v1

      - name: Instalar FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Instalar Flutter via FVM
        run: fvm install
        working-directory: ${{ env.MOBILE_DIR }}

      - name: Instalar dependências
        run: fvm flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}

      # Materializar config.production.json
      - name: Materializar config.production.json
        env:
          CONFIG_BASE64: ${{ secrets.CONFIG_PRODUCTION_JSON_BASE64 }}
        run: |
          if [[ -n "$CONFIG_BASE64" ]]; then
            echo "$CONFIG_BASE64" | base64 --decode > config.production.json
          else
            echo "⚠️  CONFIG_PRODUCTION_JSON_BASE64 not set; using existing file"
          fi
        working-directory: ${{ env.MOBILE_DIR }}

      # Instalar Shorebird
      - name: Instalar Shorebird
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      # SHOREBIRD_TOKEN está definido no env do job.
      # O Shorebird CLI lê essa variável automaticamente — não precisa de login --ci.
      # Ativar Cider
      - name: Ativar Cider
        run: dart pub global activate cider

      # Bump patch version + CHANGELOG (apenas em deploy real)
      - name: Bump patch version
        if: env.DRY_RUN != 'true'
        run: |
          cider bump patch --bump-build
          cider release
        working-directory: ${{ env.MOBILE_DIR }}

      # Executar patches do manifest
      - name: Executar patches Shorebird
        env:
          SHOREBIRD_DRY_RUN: ${{ env.DRY_RUN }}
        run: make patch-plan
        working-directory: ${{ env.MOBILE_DIR }}

      # Persistir version bump (apenas em deploy real)
      - name: Commitar version bump
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "atlasmed-bot"
          git config user.email "bot@atlasmed.com.br"
          git add ${{ env.MOBILE_DIR }}/pubspec.yaml ${{ env.MOBILE_DIR }}/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "chore: bump mobile patch to $(grep '^version:' ${{ env.MOBILE_DIR }}/pubspec.yaml | awk '{print $2}') [skip ci]"
            git push
          fi
