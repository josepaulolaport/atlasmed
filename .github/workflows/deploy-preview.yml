name: 🚀 Flutter Web — PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:
    inputs:
      channel_id:
        description: Nome do canal de preview
        required: true
        type: string
      expires:
        description: "Tempo de vida do canal (ex: 7d)"
        required: false
        default: "7d"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy_web_preview:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolver canal de preview
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_CHANNEL_ID: ${{ inputs.channel_id }}
          INPUT_EXPIRES: ${{ inputs.expires }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            channel_id="pr-$PR_NUMBER"
            expires="30d"
          else
            channel_id="$INPUT_CHANNEL_ID"
            expires="${INPUT_EXPIRES:-7d}"
          fi
          if ! [[ "$channel_id" =~ ^[a-z0-9-]{1,40}$ ]]; then
            echo "Invalid Firebase Hosting preview channel ID: $channel_id" >&2
            exit 1
          fi
          if ! [[ "$expires" =~ ^[1-9][0-9]*d$ ]]; then
            echo "Invalid preview channel expiration: $expires" >&2
            exit 1
          fi
          echo "channel_id=$channel_id" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: ./apps/mobile

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.23.0

      - name: Deploy para Firebase Hosting (Preview)
        id: deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CHANNEL_ID: ${{ steps.preview.outputs.channel_id }}
          EXPIRES: ${{ steps.preview.outputs.expires }}
        run: |
          set -euo pipefail
          output=$(firebase hosting:channel:deploy \
            "$CHANNEL_ID" \
            --project atlasmed-app \
            --expires "$EXPIRES" \
            2>&1)
          echo "$output"
          url=$(echo "$output" | grep -oE 'https://[a-z0-9.-]+--[a-z0-9-]+\.web\.app' | head -1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
        working-directory: ./apps/mobile

      - name: Post preview URL comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          SHA: ${{ github.sha }}
          EXPIRES: ${{ steps.preview.outputs.expires }}
        run: |
          set -euo pipefail
          pr_number="$PR_NUMBER"
          url="$PREVIEW_URL"
          if [[ -z "$url" ]]; then
            echo "Failed to extract preview URL."
            exit 1
          fi
          short_sha="$(printf '%.7s' "$SHA")"
          expires_raw="$EXPIRES"
          expires_offset="+${expires_raw%d} days"
          expires_date=$(date -u -d "$expires_offset" +"%a, %d %b %Y %H:%M:%S GMT")
          body="Visit the preview URL for this PR (updated for commit $short_sha):"$'\n\n'"[$url]($url)"$'\n\n'"<sub>(expires $expires_date)</sub>"$'\n\n'"<sub>🔥 via Firebase Hosting</sub>"
          existing=$(gh api "/repos/$REPOSITORY/issues/$pr_number/comments" \
            --jq '.[] | select(.body | startswith("Visit the preview URL for this PR")) | .id' | head -1)
          if [[ -n "$existing" ]]; then
            gh api "/repos/$REPOSITORY/issues/comments/$existing" \
              --method PATCH --field body="$body" --silent
          else
            gh pr comment "$pr_number" --body "$body"
          fi


  cleanup_web_preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@15.23.0

      - name: Deletar canal de preview
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          CHANNEL_ID: pr-${{ github.event.pull_request.number }}
        run: |
          if firebase hosting:channel:list --project atlasmed-app | grep -q " $CHANNEL_ID "; then
            firebase hosting:channel:delete "$CHANNEL_ID" --project atlasmed-app --force
          else
            echo "Preview channel $CHANNEL_ID was not found; skipping cleanup."
          fi
        working-directory: ./apps/mobile
