name: 🚀 Flutter Web — PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:
    inputs:
      channel_id:
        description: Nome do canal de preview
        required: true
        type: string
      expires:
        description: Tempo de vida do canal (ex: 7d)
        required: false
        default: 7d
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy_web_preview:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      checks: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolver canal de preview
        id: preview
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "channel_id=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "expires=7d" >> "$GITHUB_OUTPUT"
          else
            echo "channel_id=${{ inputs.channel_id }}" >> "$GITHUB_OUTPUT"
            echo "expires=${{ inputs.expires }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: ./apps/mobile

      - name: Deploy para Firebase Hosting (Preview)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLASMED_APP }}
          projectId: atlasmed-app
          entryPoint: ./apps/mobile
          channelId: ${{ steps.preview.outputs.channel_id }}
          expires: ${{ steps.preview.outputs.expires }}

  cleanup_web_preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Deletar canal de preview
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:channel:delete "pr-${{ github.event.pull_request.number }}" --project atlasmed-app --force
        working-directory: ./apps/mobile
