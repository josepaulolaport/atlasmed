name: 🚀 Flutter Web — PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:
    inputs:
      channel_id:
        description: Nome do canal de preview
        required: true
        type: string
      expires:
        description: "Tempo de vida do canal (ex: 7d)"
        required: false
        default: "7d"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy_web_preview:
    if: |
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolver canal de preview
        id: preview
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "channel_id=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "expires=30d" >> "$GITHUB_OUTPUT"
          else
            echo "channel_id=${{ inputs.channel_id }}" >> "$GITHUB_OUTPUT"
            echo "expires=${{ inputs.expires }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Build Flutter Web
        run: flutter build web --release
        working-directory: ./apps/mobile

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy para Firebase Hosting (Preview)
        id: deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          output=$(firebase hosting:channel:deploy \
            "${{ steps.preview.outputs.channel_id }}" \
            --project atlasmed-app \
            --expires "${{ steps.preview.outputs.expires }}" \
            2>&1)
          echo "$output"
          url=$(echo "$output" | grep -oE 'https://[a-z0-9.-]+\.web\.app' | head -1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
        working-directory: ./apps/mobile

      - name: Post preview URL comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ github.event.pull_request.number }}"
          url="${{ steps.deploy.outputs.preview_url }}"
          if [[ -z "$url" ]]; then
            echo "Failed to extract preview URL."
            exit 1
          fi
          short_sha="$(printf '%.7s' "${{ github.sha }}")"
          expires_raw="${{ steps.preview.outputs.expires }}"
          expires_offset="+${expires_raw%d} days"
          expires_date=$(date -u -d "$expires_offset" +"%a, %d %b %Y %H:%M:%S GMT")
          body="Visit the preview URL for this PR (updated for commit $short_sha):"$'\n\n'"[$url]($url)"$'\n\n'"<sub>(expires $expires_date)</sub>"$'\n\n'"<sub>🔥 via Firebase Hosting</sub>"
          existing=$(gh api "/repos/${{ github.repository }}/issues/$pr_number/comments" \
            --jq '.[] | select(.body | startswith("Visit the preview URL for this PR")) | .id' | head -1)
          if [[ -n "$existing" ]]; then
            gh api "/repos/${{ github.repository }}/issues/comments/$existing" \
              --method PATCH --field body="$body" --silent
          else
            gh pr comment "$pr_number" --body "$body"
          fi


  cleanup_web_preview:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Deletar canal de preview
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase hosting:channel:delete \
            "pr-${{ github.event.pull_request.number }}" \
            --project atlasmed-app --force
        working-directory: ./apps/mobile
