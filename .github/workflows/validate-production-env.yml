name: Validate Backend Production Environment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/workers/**'
      - 'packages/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-services-to-cluster.yml'
      - '.github/workflows/deploy-infra.yml'
      - '.github/workflows/validate-production-env.yml'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'

  workflow_call:
    secrets:
      UNCLOUD_CONNECT:
        required: true
      UNCLOUD_SSH_PRIVATE_KEY:
        required: true
      DATABASE_URL:
        required: true
      JWT_ACCESS_SECRET:
        required: true
      TOKEN_HASH_PEPPER:
        required: true
      CORS_ORIGINS:
        required: true
      FRONTEND_URL:
        required: true
      RESEND_API_KEY:
        required: true
      RESEND_FROM_EMAIL:
        required: true
      TEMPORAL_DB_PASSWORD:
        required: true
      MEILISEARCH_API_KEY:
        required: true
      STORAGE_ACCESS_KEY_ID:
        required: true
      STORAGE_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate-production-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TEMPORAL_DB_PASSWORD: ${{ secrets.TEMPORAL_DB_PASSWORD }}
      MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://atlasmed-redis:6379
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '15m' }}
      # These must mirror deploy-services-to-cluster.yml exactly. A fallback here
      # that the deploy workflow does not have makes this gate pass on values
      # that will never be deployed: delete or typo a variable and the gate goes
      # green on MinIO defaults while the cluster receives empty strings.
      # STORAGE_BUCKET and STORAGE_REGION keep defaults because the deploy has them too.
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'atlasmed-production' }}
      # R2 accepts only "auto"; MinIO ignored the region entirely. So "auto" is correct
      # for both, and the old us-east-1 default is a MinIO-era value R2 rejects.
      STORAGE_REGION: ${{ vars.STORAGE_REGION || 'auto' }}
      # No fallbacks, deliberately: these must mirror deploy-services-to-cluster.yml,
      # which has none either. A default here makes this gate pass on values that are
      # never deployed — delete or typo a variable and it goes green while the cluster
      # receives an empty string.
      # Server-side endpoint (API -> object store) and the one baked into presigned URLs
      # handed to devices. They are the same host on R2; they were not on MinIO+Caddy,
      # which is why both still exist.
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_PUBLIC_ENDPOINT: ${{ vars.STORAGE_PUBLIC_ENDPOINT }}
      # What requests are signed with — the R2 API token id and secret.
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production environment
        run: bun run env:check

      - name: Validate compose file
        run: docker compose -f deploy/uncloud.compose.yml config --quiet

      # Writes a probe object to the production bucket and deletes it. The API's
      # boot probe proves the credential can *read* — on 2026-08-12 production
      # ran with an R2 token that could list and not put, booted clean, and
      # failed every upload. A deploy that fails here leaves the working
      # container serving.
      #
      # Runs on pull requests too, despite writing to the production bucket.
      # It was deploy-only first, on the reasoning that a PR-triggered write to
      # production is a wider blast radius than the problem needs. That was the
      # wrong trade: the step was then never exercised until it ran on main,
      # where it failed immediately because turbo had not been told to pass
      # STORAGE_*. An unexercised guard is not a guard.
      #
      # The write is nine bytes under `_preflight/`, deleted immediately.
      - name: Verify object storage is writable
        run: bun run storage:check
