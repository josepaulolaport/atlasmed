name: Validate Backend Production Environment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/workers/**'
      - 'packages/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/deploy-services-to-cluster.yml'
      - '.github/workflows/deploy-infra.yml'
      - '.github/workflows/validate-production-env.yml'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'

  workflow_call:
    secrets:
      UNCLOUD_CONNECT:
        required: true
      UNCLOUD_SSH_PRIVATE_KEY:
        required: true
      DATABASE_URL:
        required: true
      JWT_ACCESS_SECRET:
        required: true
      TOKEN_HASH_PEPPER:
        required: true
      CORS_ORIGINS:
        required: true
      FRONTEND_URL:
        required: true
      RESEND_API_KEY:
        required: true
      RESEND_FROM_EMAIL:
        required: true
      TEMPORAL_DB_PASSWORD:
        required: true
      MEILISEARCH_API_KEY:
        required: true
      MINIO_ROOT_USER:
        required: true
      MINIO_ROOT_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  validate-production-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      UNCLOUD_CONNECT: ${{ secrets.UNCLOUD_CONNECT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      TOKEN_HASH_PEPPER: ${{ secrets.TOKEN_HASH_PEPPER }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      TEMPORAL_DB_PASSWORD: ${{ secrets.TEMPORAL_DB_PASSWORD }}
      MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://atlasmed-redis:6379
      JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION || '15m' }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'atlasmed-production' }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION || 'us-east-1' }}
      CNES_ARCHIVE_BACKEND: s3
      CNES_ARCHIVE_S3_BUCKET: ${{ vars.CNES_ARCHIVE_S3_BUCKET || 'cnes-raw' }}
      CNES_FTP_MODE: ${{ vars.CNES_FTP_MODE || 'mock' }}
      CNES_LOAD_MODE: ${{ vars.CNES_LOAD_MODE || 'dev' }}
      CNES_LOAD_CONCURRENCY: ${{ vars.CNES_LOAD_CONCURRENCY || '4' }}
      NEXT_PUBLIC_API_URL: https://atlasmed-api.b1ixob.uncld.dev/api/v1
      NEXT_PUBLIC_HEALTH_URL: https://atlasmed-api.b1ixob.uncld.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate production environment
        run: bun run env:check

      - name: Validate compose file
        run: docker compose -f deploy/uncloud.compose.yml config --quiet
