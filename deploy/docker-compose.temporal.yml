# Local Temporal dev stack for the AtlasMed Temporal worker
# (Emultec order import, search sync, purchase recurrence).
# Start: bun run temporal:up
# UI: http://localhost:8088  |  gRPC: localhost:7233
#
# Supporting services (Redis, MinIO, Meilisearch) live in docker-compose.dev.yml.

services:
  temporal-postgresql:
    image: postgres:15-alpine
    container_name: atlasmed-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: atlasmed-temporal
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: atlasmed-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8088:8080"
    restart: unless-stopped

volumes:
  temporal-postgres-data:
