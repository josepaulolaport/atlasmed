name: atlasmed

services:
  atlasmed-api:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/api:prod
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - REDIS_URL=redis://atlasmed-redis:6379
      - "REDIS_KEY_PREFIX=atlasmed:"
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - TOKEN_HASH_PEPPER=${TOKEN_HASH_PEPPER}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - TRUST_PROXY=true
      - SESSION_SECURITY_MODE=audit_only
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      # No defaults, deliberately. A missing value must fail at boot (the API
      # validates STORAGE_* in production) rather than silently resolving to the
      # wrong object store. A default here would defeat that check one layer down.
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-atlasmed-production}
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=atlasmed-workflows
      - OTEL_SERVICE_NAME=atlasmed-api
    depends_on:
      - atlasmed-redis
      - atlasmed-meilisearch
      - atlasmed-temporal
    x-caddy: |
      atlasmed-api.b1ixob.uncld.dev {
        encode zstd gzip
        reverse_proxy {{upstreams 3000}}
      }
      api.tdomains.uk {
        encode zstd gzip
        reverse_proxy {{upstreams 3000}}
      }

  atlasmed-api-worker:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/api-worker:prod
    build:
      context: ..
      dockerfile: deploy/docker/api-worker.Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - REDIS_URL=redis://atlasmed-redis:6379
      - "REDIS_KEY_PREFIX=atlasmed:"
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - TOKEN_HASH_PEPPER=${TOKEN_HASH_PEPPER}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL}
      - TRUST_PROXY=true
      - SESSION_SECURITY_MODE=audit_only
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      # No defaults, deliberately. A missing value must fail at boot (the API
      # validates STORAGE_* in production) rather than silently resolving to the
      # wrong object store. A default here would defeat that check one layer down.
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-atlasmed-production}
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=atlasmed-workflows
      - OTEL_SERVICE_NAME=atlasmed-api-worker
    depends_on:
      - atlasmed-redis
      - atlasmed-meilisearch
      - atlasmed-temporal

  atlasmed-temporal-worker:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/temporal-worker:prod
    build:
      context: ..
      dockerfile: deploy/docker/temporal-worker.Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=atlasmed-workflows
      # No defaults, deliberately. A missing value must fail at boot (the API
      # validates STORAGE_* in production) rather than silently resolving to the
      # wrong object store. A default here would defeat that check one layer down.
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-atlasmed-production}
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      # Emultec is a third-party production database. Read-only credentials,
      # supplied like every other secret — never on a command line. Absent
      # values leave the import disabled rather than half-configured; see
      # isEmultecMysqlConfigured.
      - EMULTEC_MYSQL_HOST=${EMULTEC_MYSQL_HOST}
      - EMULTEC_MYSQL_PORT=${EMULTEC_MYSQL_PORT:-3306}
      - EMULTEC_MYSQL_USER=${EMULTEC_MYSQL_USER}
      - EMULTEC_MYSQL_PASSWORD=${EMULTEC_MYSQL_PASSWORD}
      - EMULTEC_MYSQL_DATABASE=${EMULTEC_MYSQL_DATABASE:-atlasmed}
      - OTEL_SERVICE_NAME=atlasmed-temporal-worker
    depends_on:
      - atlasmed-temporal

  atlasmed-temporal-db:
    x-machines: oracle-luis
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_DB=temporal
    volumes:
      - atlasmed_temporal_postgres_data:/var/lib/postgresql/data

  atlasmed-temporal:
    x-machines: oracle-luis
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=atlasmed-temporal-db
    depends_on:
      - atlasmed-temporal-db

  atlasmed-temporal-ui:
    x-machines: oracle-luis
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://atlasmed-temporal-ui.b1ixob.uncld.dev,https://temporal-ui.tdomains.uk
    depends_on:
      - atlasmed-temporal
    x-caddy: |
      atlasmed-temporal-ui.b1ixob.uncld.dev {
        import atlasmed_internal_guard
        reverse_proxy {{upstreams 8080}}
      }
      temporal-ui.tdomains.uk {
        import atlasmed_internal_guard
        reverse_proxy {{upstreams 8080}}
      }

  atlasmed-redis:
    x-machines: oracle-luis
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - atlasmed_redis_data:/data

  atlasmed-meilisearch:
    x-machines: oracle-luis
    image: getmeili/meilisearch:v1.48
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - atlasmed_meilisearch_data_v148:/meili_data

volumes:
  atlasmed_temporal_postgres_data:
  atlasmed_redis_data:
  # Retain the v1.13 volume unchanged for rollback after the dump migration.
  atlasmed_meilisearch_data:
  atlasmed_meilisearch_data_v148:
  # Retained deliberately. The service is gone; the volume outlives it so the
  # 29 MB of pre-R2 objects can still be recovered until someone decides
  # otherwise. Delete it as a separate, deliberate act.
  atlasmed_minio_data:
