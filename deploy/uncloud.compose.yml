name: atlasmed

services:
  atlasmed-web:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/web:prod
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.tdomains.uk/api/v1
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.tdomains.uk/api/v1
    depends_on:
      - atlasmed-api
    x-caddy: |
      atlasmed-web.b1ixob.uncld.dev {
        reverse_proxy {{upstreams 3000}}
      }
      app.tdomains.uk {
        reverse_proxy {{upstreams 3000}}
      }

  atlasmed-api:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/api:prod
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - REDIS_URL=redis://atlasmed-redis:6379
      - "REDIS_KEY_PREFIX=atlasmed:"
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - TOKEN_HASH_PEPPER=${TOKEN_HASH_PEPPER}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://atlasmed-web.b1ixob.uncld.dev,https://app.tdomains.uk}
      - FRONTEND_URL=${FRONTEND_URL:-https://app.tdomains.uk}
      - TRUST_PROXY=true
      - SESSION_SECURITY_MODE=audit_only
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - STORAGE_ENDPOINT=http://atlasmed-minio:9000
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-https://storage.tdomains.uk}
      - STORAGE_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - STORAGE_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-atlasmed-production}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - REGISTRY_SOURCE=temporal
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=cnes-ingestion
      - OTEL_SERVICE_NAME=atlasmed-api
    depends_on:
      - atlasmed-redis
      - atlasmed-meilisearch
      - atlasmed-minio
      - atlasmed-temporal
    x-caddy: |
      atlasmed-api.b1ixob.uncld.dev {
        reverse_proxy {{upstreams 3000}}
      }
      api.tdomains.uk {
        reverse_proxy {{upstreams 3000}}
      }

  atlasmed-api-worker:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/api-worker:prod
    build:
      context: ..
      dockerfile: deploy/docker/api-worker.Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_MIN=${DATABASE_POOL_MIN:-2}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - REDIS_URL=redis://atlasmed-redis:6379
      - "REDIS_KEY_PREFIX=atlasmed:"
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - TOKEN_HASH_PEPPER=${TOKEN_HASH_PEPPER}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://atlasmed-web.b1ixob.uncld.dev}
      - FRONTEND_URL=${FRONTEND_URL}
      - TRUST_PROXY=true
      - SESSION_SECURITY_MODE=audit_only
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - STORAGE_ENDPOINT=http://atlasmed-minio:9000
      - STORAGE_PUBLIC_ENDPOINT=${STORAGE_PUBLIC_ENDPOINT:-https://storage.tdomains.uk}
      - STORAGE_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - STORAGE_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-atlasmed-production}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - REGISTRY_SOURCE=temporal
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=cnes-ingestion
      - OTEL_SERVICE_NAME=atlasmed-api-worker
    depends_on:
      - atlasmed-redis
      - atlasmed-meilisearch
      - atlasmed-minio
      - atlasmed-temporal

  atlasmed-cnes-worker:
    platform: linux/arm64
    x-machines: oracle-luis
    image: atlasmed/cnes-worker:prod
    build:
      context: ..
      dockerfile: deploy/docker/cnes-worker.Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MEILISEARCH_URL=http://atlasmed-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=cnes-ingestion
      - CNES_FTP_MODE=${CNES_FTP_MODE:-mock}
      - CNES_LOAD_MODE=${CNES_LOAD_MODE:-dev}
      - CNES_ARCHIVE_BACKEND=s3
      - CNES_ARCHIVE_S3_BUCKET=${CNES_ARCHIVE_S3_BUCKET:-cnes-raw}
      - CNES_ARCHIVE_S3_REGION=${STORAGE_REGION:-us-east-1}
      - CNES_ARCHIVE_S3_ENDPOINT=http://atlasmed-minio:9000
      - CNES_ARCHIVE_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - CNES_ARCHIVE_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - CNES_EXTRACT_DIR=/tmp/cnes-extract
      - CNES_LOAD_CONCURRENCY=${CNES_LOAD_CONCURRENCY:-4}
    depends_on:
      - atlasmed-temporal
      - atlasmed-minio

  atlasmed-temporal-db:
    x-machines: oracle-luis
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_DB=temporal
    volumes:
      - atlasmed_temporal_postgres_data:/var/lib/postgresql/data

  atlasmed-temporal:
    x-machines: oracle-luis
    image: temporalio/auto-setup:1.24.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=atlasmed-temporal-db
    depends_on:
      - atlasmed-temporal-db

  atlasmed-temporal-ui:
    x-machines: oracle-luis
    image: temporalio/ui:2.34.0
    environment:
      - TEMPORAL_ADDRESS=atlasmed-temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://atlasmed-temporal-ui.b1ixob.uncld.dev,https://temporal-ui.tdomains.uk
    depends_on:
      - atlasmed-temporal
    x-caddy: |
      atlasmed-temporal-ui.b1ixob.uncld.dev {
        import atlasmed_internal_guard
        reverse_proxy {{upstreams 8080}}
      }
      temporal-ui.tdomains.uk {
        import atlasmed_internal_guard
        reverse_proxy {{upstreams 8080}}
      }

  atlasmed-redis:
    x-machines: oracle-luis
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - atlasmed_redis_data:/data

  atlasmed-meilisearch:
    x-machines: oracle-luis
    image: getmeili/meilisearch:v1.48
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - atlasmed_meilisearch_data_v148:/meili_data

  atlasmed-minio:
    x-machines: oracle-luis
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      # Public base URL for clients (presigned PUT/GET). Console stays cluster-private.
      - MINIO_SERVER_URL=${STORAGE_PUBLIC_ENDPOINT:-https://storage.tdomains.uk}
    volumes:
      - atlasmed_minio_data:/data
    x-caddy: |
      storage.tdomains.uk {
        reverse_proxy {{upstreams 9000}}
      }

volumes:
  atlasmed_temporal_postgres_data:
  atlasmed_redis_data:
  # Retain the v1.13 volume unchanged for rollback after the dump migration.
  atlasmed_meilisearch_data:
  atlasmed_meilisearch_data_v148:
  atlasmed_minio_data:
