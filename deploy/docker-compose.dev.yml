# Local development services
# PostgreSQL runs locally (not containerised) — connect via DATABASE_URL in .env
#
# Usage:
#   bun run dev:up              — start core services (Redis, MinIO, Meilisearch)
#   bun run dev:down            — stop and remove containers
#   bun run dev:down:volumes    — stop and wipe all data volumes
#   bun run observability:up    — start ClickHouse + OTEL Collector + SigNoz on top
#
# Service URLs after dev:up:
#   Redis         localhost:6379
#   MinIO S3 API  http://localhost:9000   (key: minioadmin / minioadmin)
#   MinIO Console http://localhost:9001
#   Meilisearch   http://localhost:7700   (key: masterKey)
#   SigNoz UI     http://localhost:3301   (after observability:up)

services:

  # ---------------------------------------------------------------------------
  # Redis — sessions, rate limiting, BullMQ job queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO — local S3-compatible object storage
  # Console: http://localhost:9001  user: minioadmin  pass: minioadmin
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Meilisearch — full-text search (facilities, professionals)
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickHouse — telemetry storage backend for SigNoz
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: signoz_traces
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "9009:9009"   # TCP native protocol
      - "8123:8123"   # HTTP interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # OTEL Collector — receives traces/logs/metrics from API and workers,
  # exports to ClickHouse (SigNoz backend)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: signoz/signoz-otel-collector:0.90.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SigNoz — observability UI (traces, logs, metrics)
  # Query service backend
  # ---------------------------------------------------------------------------
  signoz-query:
    image: signoz/query-service:0.90.0
    restart: unless-stopped
    environment:
      ClickHouseUrl: tcp://clickhouse:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "false"
    ports:
      - "8080:8080"   # internal API (used by frontend)
      - "8085:8085"   # healthcheck
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # SigNoz frontend
  signoz-frontend:
    image: signoz/frontend:0.90.0
    restart: unless-stopped
    environment:
      NGINX_SIGNOZ_BACKEND: signoz-query
    ports:
      - "3301:3301"   # SigNoz UI → http://localhost:3301
    depends_on:
      signoz-query:
        condition: service_healthy

volumes:
  redis_data:
  minio_data:
  meilisearch_data:
  clickhouse_data:
