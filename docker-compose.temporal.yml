# Local Temporal dev stack for CNES ingestion worker.
# Start: docker compose -f docker-compose.temporal.yml up -d
# UI: http://localhost:8080  |  gRPC: localhost:7233

services:
  temporal-postgresql:
    image: postgres:15-alpine
    container_name: atlasmed-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network

  temporal:
    image: temporalio/auto-setup:latest
    container_name: atlasmed-temporal
    depends_on:
      - temporal-postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    networks:
      - temporal-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: atlasmed-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - temporal-network

  minio:
    image: minio/minio:latest
    container_name: atlasmed-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - temporal-network

  minio-init:
    image: minio/mc:latest
    container_name: atlasmed-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/cnes-raw;
      exit 0;
      "
    networks:
      - temporal-network

volumes:
  temporal-postgres-data:
  minio-data:

networks:
  temporal-network:
    driver: bridge
